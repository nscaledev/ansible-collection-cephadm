---
name: Tests

permissions:
  contents: read

# Controls when the action will run.
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      # Checks-out the repository under $GITHUB_WORKSPACE, so it's accessible to the job
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          persist-credentials: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test-requirements.txt

      - name: Linting code
        env:
          ANSIBLE_LIBRARY: ${{ github.workspace }}/plugins/modules
        run: |
          ansible-lint -v --force-color
          antsibull-changelog lint

  ansible-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      # Checks-out the repository under $GITHUB_WORKSPACE, so it's accessible to the job
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/stackhpc/cephadm
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          persist-credentials: false
          fetch-depth: 0

      - name: Create local branch for changed-file detection
        if: github.event_name == 'pull_request'
        working-directory: ansible_collections/stackhpc/cephadm
        run: git switch -c ansible-test-head

      - name: Install dependencies
        working-directory: ansible_collections/stackhpc/cephadm
        run: |
          python -m pip install --upgrade pip
          pip install -r test-requirements.txt

      - name: Run ansible-test sanity to download docker images
        working-directory: ansible_collections/stackhpc/cephadm
        run: |
          ansible-test sanity --docker --prime-containers

      - name: Fetch base branch for changed-file detection
        if: github.event_name == 'pull_request'
        working-directory: ansible_collections/stackhpc/cephadm
        env:
          BASE_REPOSITORY_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch "$BASE_REPOSITORY_URL" "$BASE_SHA:refs/heads/ansible-test-base"

      - name: Run ansible-test sanity on changed files
        if: github.event_name == 'pull_request'
        working-directory: ansible_collections/stackhpc/cephadm
        run: |
          ansible-test sanity --verbose --docker --junit --changed --base-branch ansible-test-base

      - name: Run ansible-test sanity
        if: github.event_name != 'pull_request'
        working-directory: ansible_collections/stackhpc/cephadm
        run: |
          ansible-test sanity --verbose --docker --junit

      - name: Run ansible-test units
        working-directory: ansible_collections/stackhpc/cephadm
        run: |
          ansible-test units --verbose --docker --coverage --requirements
          ansible-test coverage xml --requirements
          ansible-test coverage html --requirements

      - name: Print coverage report
        working-directory: ansible_collections/stackhpc/cephadm
        run: |
          ansible-test coverage report

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5
        if: ${{ always() }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          annotate_only: true
          job_summary: true
          report_paths: '**/tests/output/*/*.xml'

      - name: Upload HTML report 
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: ansible_collections/stackhpc/cephadm/tests/output/reports/coverage/
