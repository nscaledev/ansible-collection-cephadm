name: Validate Commits

on:
  push:
    branches:
      - main/2024.1
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-pr-title:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Commit Validation
        uses: nscaledev/actions/validation/commits@d7a01f0d62d670a70815e40c64f09be8eee15ea8
