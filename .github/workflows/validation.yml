name: Validate Commits

on:
  push:
    branches:
      - main/2024.1
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-pr-title:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Commit Validation
        uses: nscaledev/actions/validation/commits@40a036dc0ebedd65d71a5ae0601ced64f275c286 # v0.1.8
